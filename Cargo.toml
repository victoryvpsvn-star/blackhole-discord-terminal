[package]
name = "blackhole"
version = "2.1.0"
edition = "2021"
description = "BLACKHOLE - Discord terminal sieu nhe bang Rust: TUI kieu discordo, xem anh trong terminal, dang nhap email+password, trinh duyet an tu bat captcha, /voice qua browser"
license = "MIT"

[dependencies]
serde_json = "1"
ureq = { version = ">=2.9.0, <2.10.0", features = ["json"] }
tungstenite = { version = "0.21", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[profile.release]
opt-level = "z"       # toi uu kich thuoc binary
lto = true            # link-time optimization
codegen-units = 1     # toi uu tot nhat
panic = "abort"       # bo bang unwind -> nho hon
strip = true          # cat symbol debug
