[package]
name = "blackhole-browser"
version = "1.0.0"
edition = "2021"
description = "BLACKHOLE Browser - gaming browser sieu nhe: dung webview he thong (khong bundle engine), tab doi dau Opera GX ve RAM va do mat"
license = "MIT"

[dependencies]
tao = "0.30"
wry = { version = "0.46", features = ["devtools"] }
serde_json = "1"

[features]
devtools = []            # bật F12 DevTools cho wry::WebView::open_devtools

[profile.release]
opt-level = "z"       # toi uu kich thuoc binary — gaming browser khong nen nang
lto = true
codegen-units = 1
panic = "abort"
strip = true
