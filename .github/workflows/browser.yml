# ============================================================
#  BLACKHOLE BROWSER — 1 workflow: BUILD 2 bản + BENCH đối đầu
#    * build  : Windows x64 (WebView2) + Linux x64 (WebKitGTK)
#    * bench  : chạy thật trên runner Windows — đo COLD START, RAM 5 tabs,
#               SPEEDOMETER 3 cho BLACKHOLE vs Edge vs Chrome vs Opera GX
#    * discord: tự gửi zip build + bảng điểm số về webhook
# ============================================================

name: "BLACKHOLE Browser • Build + BENCH đối đầu"

on:
  push:
    branches: ["**"]
    paths: ["browser/**", ".github/workflows/browser.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/1570794468356137060/NMGpqRun_Z13CiNZQTp6AlB59psNca9hnnJcfJ2rjU1jv7ftl2hvN8lAxKAUviV_6CgI"

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, ext: ".exe" }
          - { name: linux-x64,   os: ubuntu-latest,  ext: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Cài thư viện hệ thống (Linux — WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: browser
          key: browser-${{ matrix.name }}

      - name: Build release
        working-directory: browser
        run: cargo build --release

      - name: Đóng gói + checksum
        shell: pwsh
        run: |
          $name = "${{ matrix.name }}"
          $ext  = "${{ matrix.ext }}"
          $bin  = "browser/target/release/blackhole-browser$ext"
          $out  = "blackhole-browser-$name$ext"
          Copy-Item $bin $out -Force
          if (-not $IsWindows) { try { strip $out } catch {} }
          Compress-Archive -Path $out -DestinationPath "blackhole-browser-$name.zip" -Force
          ((Get-FileHash $out -Algorithm SHA256).Hash.ToLower() + "  $out") |
            Set-Content "blackhole-browser-$name.sha256"
          Get-Item $out, "blackhole-browser-$name.zip", "blackhole-browser-$name.sha256" |
            ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Lưu artifact (zip + sha)
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-browser-zip-${{ matrix.name }}
          path: |
            blackhole-browser-${{ matrix.name }}.zip
            blackhole-browser-${{ matrix.name }}.sha256
          if-no-files-found: error

      - name: Lưu artifact (exe riêng cho bench)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-browser-bin-windows-x64
          path: blackhole-browser-windows-x64.exe
          if-no-files-found: error

  discord-build:
    name: Gửi build browser về Discord
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Tải artifact
        uses: actions/download-artifact@v4
        with:
          pattern: blackhole-browser-zip-*
          path: dist
          merge-multiple: true

      - name: Gửi file + thông báo
        env:
          BUILD_OK: ${{ needs.build.result == 'success' }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd dist
          DESC=""
          for f in blackhole-browser-*.zip; do
            [ -e "$f" ] || continue
            SZ=$(du -h "$f" | cut -f1)
            DESC="${DESC}• ${f} (${SZ})"$'\n'
          done
          if [ "$BUILD_OK" = "true" ]; then
            COLOR=3066993
            TITLE="✅ BLACKHOLE Browser 1.0 build xong — gửi đủ bản"
            BODY="Gaming browser siêu nhẹ: KHÔNG bundle engine (dùng WebView2/WebKitGTK có sẵn trong máy) — binary vài MB, không service nền, không telemetry. BENCH đối đầu Edge/Chrome/Opera GX đang chạy bên dưới, điểm số gửi tiếp sau ít phút."
          else
            COLOR=15158332
            TITLE="❌ Build BLACKHOLE Browser lỗi"
            BODY="Vào tab Actions xem log."
          fi
          PAYLOAD=$(jq -n --arg title "$TITLE" --arg body "$BODY" --arg desc "$DESC" \
            --arg repo "$REPO" --arg sha "${SHA:0:7}" --argjson color "$COLOR" \
            '{username:"BLACKHOLE Builder", content:$body,
              embeds:[{title:$title, description:$desc, color:$color,
                fields:[{name:"Repo",value:$repo},{name:"Commit",value:$sha}],
                footer:{text:"BLACKHOLE Browser • webview hệ thống • zero bloat"}}]}')
          ARGS=(-sS -o resp.json -w "%{http_code}" "${DISCORD_WEBHOOK_URL}?wait=true"
                -F "payload_json=${PAYLOAD}")
          i=0
          for f in blackhole-browser-*.zip; do
            [ -e "$f" ] || continue
            ARGS+=(-F "files[$i]=@$f")
            i=$((i+1))
          done
          CODE=$(curl "${ARGS[@]}")
          echo "Webhook HTTP: $CODE"

  bench:
    name: BENCH vs Edge/Chrome/Opera GX
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Tải exe BLACKHOLE Browser
        uses: actions/download-artifact@v4
        with:
          name: blackhole-browser-bin-windows-x64
          path: dist

      - name: Cài Google Chrome
        run: choco install googlechrome -y --no-progress

      - name: Cài Opera GX (đối thủ gaming gen 5)
        continue-on-error: true
        run: choco install opera-gx -y --no-progress

      - name: Sinh 5 trang bench
        shell: pwsh
        run: ./browser/bench/gen-pages.ps1

      - name: Chạy BENCH (cold start + RAM + Speedometer 3)
        shell: pwsh
        run: ./browser/bench/bench.ps1

      - name: Lưu artifact điểm số
        uses: actions/upload-artifact@v4
        with:
          name: browser-bench-result
          path: browser/bench/result
          if-no-files-found: warn

      - name: Gửi ĐIỂM SỐ về Discord
        if: always()
        shell: pwsh
        run: |
          $res = "browser/bench/result"
          if (Test-Path "$res/bench.json") {
            $j = Get-Content "$res/bench.json" -Raw | ConvertFrom-Json
            $desc = ($j.tableLines -join "`n")
            $payload = @{
              username = 'BLACKHOLE BenchBot'
              content  = ("KẾT QUẢ BENCH — thắng cold start: " + $j.winStart +
                          " | thắng RAM 5 tabs: " + $j.winRam +
                          " | thắng Speedometer 3: " + $j.winSpeed)
              embeds   = @(@{
                title       = "🏆 BENCH ĐỐI ĐẦU: BLACKHOLE Browser vs Edge vs Chrome vs Opera GX"
                description = $desc
                color       = 3066993
                fields      = @(
                  @{ name = "Kết luận";     value = $j.verdict },
                  @{ name = "Máy bench";    value = $j.machine }
                )
                footer      = @{ text = "BLACKHOLE Browser 1.0 • bench THẬT trên GitHub Actions runner" }
              })
            } | ConvertTo-Json -Depth 8
            curl.exe -sS -o wr.json -w "WEBHOOK_HTTP=%{http_code}`n" "$env:DISCORD_WEBHOOK_URL?wait=true" `
              -F "payload_json=$payload" `
              -F "files[0]=@$res/bench.md" -F "files[1]=@$res/bench.json"
            Get-Content wr.json -ErrorAction SilentlyContinue | Select-Object -First 1
          } else {
            $payload = @{ username = 'BLACKHOLE BenchBot'; content = '❌ BENCH có lỗi — xem log Actions' } | ConvertTo-Json
            curl.exe -sS -o wr.json -w "WEBHOOK_HTTP=%{http_code}`n" "$env:DISCORD_WEBHOOK_URL?wait=true" -F "payload_json=$payload"
          }
