name: vps-bench debug
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Debug timing inside debian:12
        run: |
          docker run --rm -v "$PWD:/work" -w /work debian:12 /bin/sh -c '
            apt-get update -qq && apt-get install -y -qq bash curl openssl procps >/dev/null
            bash vps-bench/tests/debug-debian.sh
          '
